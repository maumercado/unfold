[package]
name = "unfold"
version = "2.0.0"
edition = "2024"
description = "A high-performance JSON viewer"
authors = ["Mauricio Mercado"]
license = "MIT"
publish = false  # This is a GUI app, not a library

[workspace]
members = ["crates/unfold-core"]

[dependencies]
unfold-core = { path = "crates/unfold-core" }
# GPUI and its component library. Pinned exactly: gpui-kit is pre-1.0 and its
# API moves between releases, so upgrade on purpose.
gpui-kit = "=0.10.0"
futures = "0.3"
# Blocking client: GPUI has its own async executor, not Tokio (see update_check.rs)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Window icon (same major version GPUI uses for WindowOptions::icon)
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Unfold"
identifier = "com.codigo.unfold"
icon = ["assets/icon.icns"]
short_description = "A high-performance JSON viewer"
long_description = "Unfold is a fast, native JSON viewer built in Rust. Features include syntax highlighting, search with regex support, keyboard shortcuts, and efficient handling of large files."
category = "Developer Tool"
copyright = "Copyright (c) 2025 Mauricio Mercado"
