[package]
name = "unfold-gpui"
version = "0.1.0"
edition = "2024"
description = "Unfold JSON viewer on GPUI (gpui-kit) - migration in progress"
license = "MIT"
publish = false

[[bin]]
name = "unfold-gpui"
path = "src/main.rs"

[dependencies]
unfold-core = { path = "../unfold-core" }
# Pinned exactly: gpui-kit is pre-1.0 and its API moves between releases.
gpui-kit = "=0.10.0"
serde_json = "1.0.145"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
