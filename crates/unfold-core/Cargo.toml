[package]
name = "unfold-core"
version = "0.1.0"
edition = "2024"
description = "UI-free core of Unfold: JSON tree, search, export, config and row flattening"
license = "MIT"
publish = false

[dependencies]
dirs = "6.0"
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: objects keep the key order from the file. GPUI turns this
# feature on for the whole build anyway, so we set it here to make the order
# the same in every build (Iced alone used to sort keys alphabetically).
serde_json = { version = "1.0.145", features = ["preserve_order"] }
